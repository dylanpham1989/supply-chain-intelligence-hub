apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  ENV: staging
  API_PREFIX: /api/v1
  LLM_PROVIDER: mock
  VECTOR_BACKEND: pgvector
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  S3_BUCKET: scih-documents
  # Read by the KEDA trigger, which needs host:port rather than a dsn.
  REDIS_ADDRESS: redis:6379
  CORS_ORIGINS: '["http://localhost"]'
