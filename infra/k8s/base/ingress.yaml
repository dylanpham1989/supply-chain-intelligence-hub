apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scih
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Longest prefix wins in the nginx controller, so the api rule is
          # matched before the catch-all that serves the single page app.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
