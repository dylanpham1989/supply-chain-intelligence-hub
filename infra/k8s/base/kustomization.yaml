apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scih

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: scih

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - pdb.yaml
  - worker-deployment.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - migration-job.yaml
  - networkpolicy.yaml
