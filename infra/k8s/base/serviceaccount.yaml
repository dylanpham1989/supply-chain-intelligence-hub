apiVersion: v1
kind: ServiceAccount
metadata:
  name: scih
  # On EKS this annotation is what lets the pod assume an IAM role directly:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/scih-app
  # With IRSA there is no access key anywhere in the cluster to leak or rotate.
  # The staging overlay adds it; locally MinIO takes static credentials instead.
automountServiceAccountToken: false
