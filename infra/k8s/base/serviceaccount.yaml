apiVersion: v1
kind: ServiceAccount
metadata:
  name: scih
  # On EKS this annotation is what lets the pod assume an IAM role directly:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/scih-app
  # With IRSA there is no access key anywhere in the cluster to leak or rotate.
  # The staging overlay adds it; locally MinIO takes static credentials instead.
# Nothing here talks to the Kubernetes API, so the default token is not mounted.
# IRSA is unaffected: the EKS webhook adds its own projected token volume for
# the role above, which is a separate mount from this one.
automountServiceAccountToken: false
