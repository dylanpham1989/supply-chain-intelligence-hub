apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: scih
      # Longer than the 300s arq job timeout plus room to finish writing, so a
      # rollout never cuts an ingestion in half and leaves a document half
      # indexed. The two numbers have to be read together.
      terminationGracePeriodSeconds: 320
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/dylanpham1989/scih-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # `kubectl top` reports 441 MiB with the model loaded and 661 MiB
          # right after indexing and embedding a document. 1Gi leaves room for a
          # batch of 32 chunks from a larger one, and requests equal to limits
          # put the pod in the Guaranteed QoS class, so a node under memory
          # pressure evicts something else first rather than losing a job in
          # flight.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1Gi
          # The worker serves no traffic, so there is nothing to probe over
          # HTTP. arq writes a heartbeat into Redis and `--check` reads it, which
          # is a better signal than the process existing: a worker whose event
          # loop is wedged stops writing the heartbeat while its process stays
          # up. The first attempt used pgrep, which is not in the image at all,
          # so the probe failed for the one reason that said nothing about the
          # worker.
          startupProbe:
            exec:
              command: ["arq", "worker.settings.WorkerSettings", "--check"]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["arq", "worker.settings.WorkerSettings", "--check"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
