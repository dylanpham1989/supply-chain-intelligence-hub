# A Kubernetes Secret is base64, not encryption. Anyone who can run
# `kubectl get secret -o yaml` can read it, and committing one to a public repo
# publishes it. Outside the local cluster the values stay in AWS Secrets
# Manager and the External Secrets Operator syncs them in, so the repo holds
# the reference and never the value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: scih/staging/app
