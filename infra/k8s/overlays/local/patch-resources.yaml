# A laptop running kind has one node and no room for the cloud numbers. Only
# the requests move: limits stay where they are, so an OOMKill here would still
# be an OOMKill in a cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 100m
              memory: 700Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: 200m
              memory: 600Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
# Without this the HPA reads minReplicas 2 and immediately undoes the single
# replica above, which makes the whole patch look like it does nothing.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  minReplicas: 1
  maxReplicas: 2
