name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# A second push to the same branch makes the first run pointless. Without this
# they both keep a runner busy to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default token can write to the repository. Nothing here needs to.
permissions:
  contents: read

env:
  UV_VERSION: "0.9.6"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run mypy app ai worker
        working-directory: backend

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Plain postgres has no pgvector, and the first migration would fail.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scih
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d scih"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        # This image starts the server with no arguments, which a services entry
        # cannot pass. MinIO's own images need authentication to pull.
        image: bitnamilegacy/minio:2024
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/ready"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://app_user:app_password@localhost:5432/scih
      DATABASE_OWNER_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/scih
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # The mock provider is why a public repository can run the whole pipeline
      # in CI with no API key and no spend.
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/uv.lock') }}
      - run: uv sync --all-groups
        working-directory: backend
      - name: Create the application role and extensions
        run: psql "postgresql://postgres:postgres@localhost:5432/scih" -f backend/scripts/init-db.sql
      - run: uv run alembic upgrade head
        working-directory: backend
      - name: Wait for object storage
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/ready && break
            sleep 2
          done
      - run: uv run pytest --cov --cov-report=term --cov-report=json
        working-directory: backend
      - name: Enforce coverage on security critical modules
        run: uv run python scripts/check_critical_coverage.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test -- --run
        working-directory: frontend

  api-contract:
    # The frontend types are generated from the OpenAPI schema. Without this
    # job, a renamed field passes every test and breaks at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --all-groups
        working-directory: backend
      - name: Export the schema
        # Straight from the app object, so no database or model download is
        # needed to answer what the API looks like.
        run: uv run python -c "import json;from app.main import create_app;print(json.dumps(create_app().openapi()))" > /tmp/openapi.json
        working-directory: backend
      - name: Regenerate the client types
        run: |
          npx --yes openapi-typescript@7 /tmp/openapi.json -o frontend/src/types/api.ts
          npx --yes prettier@3 --write frontend/src/types/api.ts
      - name: Fail if they were not committed
        run: git diff --exit-code -- frontend/src/types/api.ts

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every overlay
        run: |
          cp infra/k8s/overlays/local/secret.env.example infra/k8s/overlays/local/secret.env
          kubectl kustomize infra/k8s/overlays/local > /dev/null
          kubectl kustomize infra/k8s/overlays/staging > /dev/null
      - name: Check the KEDA object against the published schema
        # It is not part of any overlay, because the CRD is not installed in the
        # demo cluster. This keeps it from rotting anyway.
        run: |
          curl -fsSL -o /tmp/keda.json https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/keda.sh/scaledobject_v1alpha1.json
          pipx install check-jsonschema
          check-jsonschema --schemafile /tmp/keda.json infra/k8s/base/worker-keda.yaml
